<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>摩尔勇士 离线版</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game ruffle-player { width: 100%; height: 100%; }
</style>
<script>
  // Debug switches (the Android shell may override before load)
  window.MOLE_DEBUG = true;
  window.MOLE_TRACE = /trace=1/.test(location.search);
  // Function stubs Login.swf expects from the original web page (ExternalInterface).
  function getUrlParams() { return {}; }
  function getHostname() { return 'localhost'; }
  function getSessionID() { return ''; }
  function getSign() { return ''; }
</script>
<script src="server/md5.js"></script>
<script src="server/core.js"></script>
<script src="server/gamedata.js"></script>
<script src="server/login.js"></script>
<script src="server/online.js"></script>
<script src="server/online_init.js"></script>
<script src="server/online_role.js"></script>
<script src="server/online_map.js"></script>
<script src="server/online_battle.js"></script>
<script src="server/online_task.js"></script>
<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: 'on', unmuteOverlay: 'hidden', splashScreen: false, letterbox: 'on',
    logLevel: window.MOLE_DEBUG ? 'info' : 'warn',
    allowNetworking: 'all', allowScriptAccess: true, warnOnUnsupportedContent: false,
    contextMenu: 'off', showSwfDownload: false, openUrlMode: 'deny',
    deviceFontRenderer: 'canvas',
    // Flash sockets are redirected to the in-page servers (server/core.js FakeWebSocket).
    socketProxy: [
      { host: '202.189.23.31', port: 1800, proxyUrl: 'ws://mole.local/login' },
      { host: '10.0.0.1', port: 1800, proxyUrl: 'ws://mole.local/login' },
      { host: '10.0.0.1', port: 1863, proxyUrl: 'ws://mole.local/online' },
    ],
  };
</script>
<script src="ruffle/ruffle.js"></script>
</head>
<body>
<div id="game"></div>
<script>
  const player = window.RufflePlayer.newest().createPlayer();
  player.openHardwareAccelerationModal = () => {};
  document.getElementById('game').appendChild(player);
  const q = new URLSearchParams(location.search);
  if (q.get('r')) window.RufflePlayer.config.preferredRenderer = q.get('r');
  if (q.get('q')) window.RufflePlayer.config.quality = q.get('q');
  window.Mole.Data.ready.finally(() => player.load({ url: 'Client.swf', parameters: {} }));
  window.__player = player;
  // Ruffle's "hardware acceleration disabled" modal blocks touches; the game itself still runs.
  player.openHardwareAccelerationModal = () => {};
</script>
</body>
</html>
