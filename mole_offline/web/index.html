<title>摩尔勇士 离线版</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game ruffle-player { width: 100%; height: 100%; }
</style>
<script>
  // On the phone, forward errors, warnings and [mole] progress lines to files/mole_log.txt (native bridge),
  // so a crash report can show how far the game got. Also logs JS heap use every 15 s.
  (function () {
    const N = window.MoleNative; if (!N || !N.log) return;
    const t0 = Date.now();
    const out = (lvl, args) => {
      try {
        let s = Array.prototype.map.call(args, a => (typeof a === 'string' ? a : (a && a.stack) || JSON.stringify(a))).join(' ');
        s = s.replace(/%c/g, '').replace(/color: [^;]+;?|background: [^;]+;?|font-style: [^;]+;?/g, '');
        if (lvl === 'log' && !/\[mole\]|失败|Error|error|panic|加载|renderer/.test(s)) return;
        N.log(((Date.now() - t0) / 1000).toFixed(1) + 's ' + lvl + ' ' + s.slice(0, 400));
      } catch (e) { }
    };
    ['log', 'warn', 'error'].forEach(l => { const o = console[l].bind(console); console[l] = function () { o.apply(null, arguments); out(l, arguments); }; });
    window.addEventListener('error', e => out('error', ['window.onerror', e.message, e.filename + ':' + e.lineno]));
    window.addEventListener('unhandledrejection', e => out('error', ['unhandledrejection', String(e.reason && (e.reason.stack || e.reason))]));
    N.log('==== start ' + new Date().toString() + ' ' + navigator.userAgent);
    setInterval(() => { const m = performance.memory; N.log(((Date.now() - t0) / 1000).toFixed(1) + 's mem ' + (m ? Math.round(m.usedJSHeapSize / 1048576) + '/' + Math.round(m.jsHeapSizeLimit / 1048576) + 'MB' : 'n/a')); }, 15000);
  })();
  // Debug switches (the Android shell may override before load)
  window.MOLE_DEBUG = true;
  window.MOLE_TRACE = /trace=1/.test(location.search);
  // Function stubs Login.swf expects from the original web page (ExternalInterface).
  function getUrlParams() { return {}; }
  function getHostname() { return 'localhost'; }
  function getSessionID() { return ''; }
  function getSign() { return ''; }
</script>

<script>
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: 'on', unmuteOverlay: 'hidden', splashScreen: false, letterbox: 'on',
    logLevel: window.MOLE_DEBUG ? 'info' : 'warn',
    allowNetworking: 'all', allowScriptAccess: true, warnOnUnsupportedContent: false,
    contextMenu: 'off', showSwfDownload: false, openUrlMode: 'deny',
    deviceFontRenderer: 'canvas',
    maxExecutionDuration: 120,   // some maps (勇士大厅 11302) run a long init script; the default 15 s aborted it
    quality: 'medium',   // 'low' made small text unreadable on the phone
    // Flash sockets are redirected to the in-page servers (server/core.js FakeWebSocket).
    socketProxy: [
      { host: '202.189.23.31', port: 1800, proxyUrl: 'ws://mole.local/login' },
      { host: '10.0.0.1', port: 1800, proxyUrl: 'ws://mole.local/login' },
      { host: '10.0.0.1', port: 1863, proxyUrl: 'ws://mole.local/online' },
    ],
  };
</script>
<script>
  // Memory: Ruffle sizes its drawing surface by devicePixelRatio. Phones report about 3, i.e. 9x the pixels
  // of the game's own 990x560 stage, and every frame buffer / cached bitmap grows with it. Cap it (default 2: text stays sharp; the big memory use was the blend-mode copies, see tools/swfplace.py;
  // ?dpr= for tests, 0 = no cap; the modifier's 画面 tab saves a choice).
  (function () {
    let cap = 2; try { const v = localStorage.getItem('mole_dpr'); if (v !== null) cap = parseFloat(v); } catch (e) { }
    const qd = new URLSearchParams(location.search).get('dpr'); if (qd !== null) cap = parseFloat(qd);
    const real = window.devicePixelRatio || 1; window.__moleRealDpr = real;
    if (cap > 0 && real > cap) { try { Object.defineProperty(window, 'devicePixelRatio', { get: () => cap, configurable: true }); } catch (e) { } }
    window.__moleDpr = Math.min(real, cap > 0 ? cap : real);
  })();
</script>
<script src="ruffle/ruffle.js"></script>
</head>
<body>
<div id="game"></div>
<script>
  const player = window.RufflePlayer.newest().createPlayer();
  player.openHardwareAccelerationModal = () => {};
  document.getElementById('game').appendChild(player);
  const q = new URLSearchParams(location.search);
  // Renderer: ?r= (tests) > choice saved in the modifier's 画面 tab > wgpu-webgl, the backend all desktop tests ran on.
  // Ruffle falls back to the other backends by itself if the preferred one cannot start.
  let savedR = ''; try { savedR = localStorage.getItem('mole_renderer') || ''; } catch (e) { }
  window.RufflePlayer.config.preferredRenderer = q.get('r') || savedR || 'wgpu-webgl';
  // remember which backend Ruffle really used (Ruffle logs "Used renderer: X"); shown in the modifier's 画面 tab
  { const o = console.log; console.log = function () { const m = /Used renderer: ([\w-]+)/.exec(String(arguments[0])); if (m) { window.__moleRenderer = m[1];
      o.call(console, '[mole] renderer ' + m[1]); } return o.apply(console, arguments); }; }
  if (q.get('q')) window.RufflePlayer.config.quality = q.get('q');
  window.Mole.Data.ready.finally(() => player.load({ url: 'Client.swf', parameters: {} }));
  window.__player = player;
  // Ruffle's "hardware acceleration disabled" modal blocks touches; the game itself still runs.
  player.openHardwareAccelerationModal = () => {};
</script>
<script src="modpanel.js"></script>
</body>
